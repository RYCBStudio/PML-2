name: Sync Large Release Assets to OpenList

on:
  release:
    types: [published]      # Release 发布时自动触发
  workflow_dispatch:        # 支持手动触发（调试用）

jobs:
  sync-large:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. 解析 Release tag ----------
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release view --json tagName -q .tagName --repo ${{ github.repository }})
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # ---------- 2. 筛选大文件（>= 99MB，与 Worker 阈值一致） ----------
      - name: Find large assets (>= 99MB)
        id: large
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 99614720 = 99 * 1024 * 1024
          LARGE=$(gh release view "${{ steps.release.outputs.tag }}" \
            --json assets \
            -q '.assets[] | select(.size >= 99614720) | .name' \
            --repo ${{ github.repository }})
          if [ -z "$LARGE" ]; then
            echo "No large assets found. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found large assets:"
            echo "$LARGE"
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$LARGE" > /tmp/large_assets.txt
          fi

      # ---------- 3. 下载大文件 ----------
      - name: Download large assets
        if: steps.large.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "Downloading: $name"
            gh release download "${{ steps.release.outputs.tag }}" \
              --pattern "$name" \
              --dir downloads \
              --repo ${{ github.repository }}
          done < /tmp/large_assets.txt

      # ---------- 4. 上传到 OpenList ----------
      - name: Upload to OpenList via API
        if: steps.large.outputs.found == 'true'
        env:
          OPENLIST_URL: ${{ secrets.OPENLIST_URL }}
          OPENLIST_USERNAME: ${{ secrets.OPENLIST_USERNAME }}
          OPENLIST_PASSWORD: ${{ secrets.OPENLIST_PASSWORD }}
          OPENLIST_PATH: "/mefrp-desktop/ME-Frp PML2/mefrp"
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 << 'PYEOF'
          import os, re, sys, json, urllib.request, urllib.parse

          url = os.environ['OPENLIST_URL']
          username = os.environ['OPENLIST_USERNAME']
          password = os.environ['OPENLIST_PASSWORD']
          base_path = os.environ['OPENLIST_PATH']
          tag = os.environ['TAG']

          # ---- 文件名还原（与 Worker 保持一致） ----
          EXT_REGEX = re.compile(
              r'\.(tar\.gz|tar\.xz|tar\.bz2|tar\.zst|tgz|7z|zip|dmg|exe|deb|rpm|apk|msi)$',
              re.I
          )
          VER_REGEX = re.compile(r'\d+\.\d+\.\d+(?:\.\d+)?')

          def restore_spaces(name):
              m = EXT_REGEX.search(name)
              ext = m.group(0) if m else ''
              base = name[:-len(ext)] if ext else name
              versions = []
              def protect(match):
                  versions.append(match.group(0))
                  return f'\x00V{len(versions)-1}\x00'
              base = VER_REGEX.sub(protect, base)
              base = base.replace('.', ' ')
              base = re.sub(r'\x00V(\d+)\x00', lambda m: versions[int(m.group(1))], base)
              return base + ext

          # ---- 1. 登录 OpenList 获取 JWT ----
          print('Logging in to OpenList...')
          login_data = json.dumps({'username': username, 'password': password}).encode()
          req = urllib.request.Request(
              f'{url}/api/auth/login',
              data=login_data,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())
          token = result.get('data', {}).get('token')
          if not token:
              print(f'❌ Login failed: {result}')
              sys.exit(1)
          print('✅ Login successful.')

          # ---- 2. 收集待上传文件 ----
          files = sorted(
              f for f in os.listdir('downloads')
              if os.path.isfile(os.path.join('downloads', f))
          )
          if not files:
              print('No files to upload.')
              sys.exit(0)

          # ---- 3. 逐个上传 ----
          success = 0
          for filename in files:
              filepath = os.path.join('downloads', filename)
              restored = restore_spaces(filename)
              target = f'{base_path}/{tag}/{restored}'
              encoded_target = urllib.parse.quote(target, safe='')
              size_mb = os.path.getsize(filepath) / 1024 / 1024

              print(f'\n📤 Uploading: {filename}')
              print(f'   → Restored: {restored}')
              print(f'   → Target:   {target}')
              print(f'   → Size:     {size_mb:.2f} MB')

              with open(filepath, 'rb') as f:
                  file_data = f.read()

              req = urllib.request.Request(
                  f'{url}/api/fs/put',
                  data=file_data,
                  headers={
                      'Authorization': token,
                      'File-Path': encoded_target,
                      'Content-Type': 'application/octet-stream',
                      'Overwrite': 'true',
                      'As-Task': 'true',
                  },
                  method='PUT'
              )
              try:
                  with urllib.request.urlopen(req, timeout=600) as resp:
                      result = json.loads(resp.read())
              except Exception as e:
                  print(f'❌ Upload error: {e}')
                  sys.exit(1)

              if result.get('code') != 200:
                  print(f'❌ OpenList error: {result}')
                  sys.exit(1)

              print(f'✅ Done: {restored}')
              success += 1

          print(f'\n🎉 {success}/{len(files)} large assets synced to: {base_path}/{tag}/')
          PYEOF

      # ---------- 5. 触发 Worker 更新 files.json ----------
      - name: Trigger Worker to update files.json
        if: steps.large.outputs.found == 'true'
        run: |
          echo "Triggering Worker sync for files.json..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "https://gh-sync.rycb.tech/api/trigger")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | head -n-1)
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Worker trigger returned HTTP $HTTP_CODE (non-fatal)"
          else
            echo "✅ Worker triggered successfully — files.json will be updated shortly."
          fi