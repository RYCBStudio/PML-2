name: Release (Linux / macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 26.1.1'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: MEFrpLauncherX/MEFrpLauncherX.csproj
  APP_EXE: MEFrpLauncherX
  APP_BUNDLE_NAME: 'PML 2.app'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            os_name: linux
            arch: x64
            pkg_arch: amd64
            mode: r2r
          - rid: linux-arm64
            os: ubuntu-latest
            os_name: linux
            arch: arm64
            pkg_arch: arm64
            mode: r2r
          - rid: linux-x64
            os: ubuntu-latest
            os_name: linux
            arch: x64
            pkg_arch: amd64
            mode: aot
          - rid: linux-arm64
            os: ubuntu-latest
            os_name: linux
            arch: arm64
            pkg_arch: arm64
            mode: aot
          - rid: osx-x64
            os: macos-latest
            os_name: macos
            arch: x64
            pkg_arch: x64
            mode: r2r
          - rid: osx-arm64
            os: macos-latest
            os_name: macos
            arch: arm64
            pkg_arch: arm64
            mode: r2r
          - rid: osx-x64
            os: macos-latest
            os_name: macos
            arch: x64
            pkg_arch: x64
            mode: aot
          - rid: osx-arm64
            os: macos-latest
            os_name: macos
            arch: arm64
            pkg_arch: arm64
            mode: aot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          MODE="${{ matrix.mode }}"
          OUT="./publish/\( {RID}- \){MODE}"
          mkdir -p "$OUT"
          echo "Publishing to: $OUT"

          if [ "$MODE" = "aot" ]; then
            dotnet publish "${{ env.PROJECT }}" \
              -c Release \
              -r "$RID" \
              --self-contained true \
              -p:PublishAot=true \
              -p:PublishTrimmed=true \
              -o "$OUT" \
              --nologo -v q
          else
            dotnet publish "${{ env.PROJECT }}" \
              -c Release \
              -r "$RID" \
              --self-contained true \
              -p:PublishReadyToRun=true \
              -p:PublishTrimmed=true \
              -o "$OUT" \
              --nologo -v q
          fi

          if [ -f "\( OUT/ \){{ env.APP_EXE }}" ]; then
            chmod +x "\( OUT/ \){{ env.APP_EXE }}"
          else
            echo "WARNING: executable not found: \( OUT/ \){{ env.APP_EXE }}"
            ls -la "$OUT" | head -50
          fi
          echo "Publish OK ($MODE), files: $(find "$OUT" -type f | wc -l)"

      - name: Inject Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          OUT="./publish/\( {{ matrix.rid }}- \){{ matrix.mode }}"
          if [ -n "${SENTRY_DSN:-}" ]; then
            printf '%s\n' "{\"SentryDsn\":\"${SENTRY_DSN}\"}" > "$OUT/sentry.json"
            echo "sentry.json injected"
          else
            echo "No SENTRY_DSN secret, skip"
          fi

      - name: Install zstd (Ubuntu)
        if: matrix.os_name == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y zstd

      - name: Install zstd (macOS)
        if: matrix.os_name == 'macos'
        run: brew list zstd &>/dev/null || brew install zstd

      - name: Pack tar.gz + tar.zst
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          MODE="${{ matrix.mode }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH="${{ matrix.arch }}"
          OUT="./publish/\( {RID}- \){MODE}"
          mkdir -p dist

          if [ ! -d "$OUT" ]; then
            echo "Publish dir missing: $OUT"
            ls -la ./publish || true
            exit 1
          fi

          TGZ="pml2-\( {V}- \){OS_NAME}-\( {ARCH}- \){MODE}-portable.tar.gz"
          TZST="pml2-\( {V}- \){OS_NAME}-\( {ARCH}- \){MODE}-portable.tar.zst"

          tar -C "\( OUT" -cf - . | gzip -9 > "dist/ \){TGZ}"
          tar -C "\( OUT" -cf - . | zstd -T0 -19 -o "dist/ \){TZST}"
          gzip -t "dist/${TGZ}"
          zstd -t "dist/${TZST}"
          ls -lh dist/

      - name: Install nFPM
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Build deb + rpm
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          MODE="${{ matrix.mode }}"
          ARCH="${{ matrix.arch }}"
          PKG_ARCH="${{ matrix.pkg_arch }}"
          OUT="./publish/\( {RID}- \){MODE}"
          ROOT="pkgroot"
          EXE="${{ env.APP_EXE }}"

          if [ ! -d "$OUT" ]; then
            echo "Publish dir missing: $OUT"
            exit 1
          fi

          rm -rf "$ROOT"
          mkdir -p "$ROOT/opt/pml-2" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp -a "$OUT/." "$ROOT/opt/pml-2/"

          cat > "$ROOT/usr/bin/pml-2" << EOF
          #!/bin/sh
          exec /opt/pml-2/${EXE} "\$@"
          EOF
          chmod +x "$ROOT/usr/bin/pml-2"
          chmod +x "\( ROOT/opt/pml-2/ \){EXE}" 2>/dev/null || true

          cat > "$ROOT/usr/share/applications/pml-2.desktop" << 'EOF'
          [Desktop Entry]
          Name=PML 2
          Comment=Cross-platform ME Frp graphical launcher
          Exec=pml-2
          Icon=pml-2
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          StartupNotify=true
          EOF

          PKG_NAME="pml-2"
          if [ "$MODE" = "aot" ]; then
            PKG_NAME="pml-2-aot"
          fi

          cat > nfpm.yaml << EOF
          name: ${PKG_NAME}
          arch: ${PKG_ARCH}
          platform: linux
          version: ${V}
          section: utils
          priority: optional
          maintainer: RYCB Studio <im@rycb.tech>
          description: |
            PML 2 is a cross-platform graphical launcher for ME Frp (${MODE}).
          vendor: RYCB Studio
          homepage: https://www.rycb.tech/pml-2
          license: MIT
          contents:
            - src: ${ROOT}/opt/pml-2
              dst: /opt/pml-2
              type: tree
            - src: ${ROOT}/usr/bin/pml-2
              dst: /usr/bin/pml-2
              file_info:
                mode: 0755
            - src: ${ROOT}/usr/share/applications/pml-2.desktop
              dst: /usr/share/applications/pml-2.desktop
          EOF

          mkdir -p dist
          nfpm package -f nfpm.yaml -p deb -t "dist/pml2-\( {V}-linux- \){ARCH}-${MODE}.deb"
          nfpm package -f nfpm.yaml -p rpm -t "dist/pml2-\( {V}-linux- \){ARCH}-${MODE}.rpm"
          ls -lh dist/*.deb dist/*.rpm

      - name: Build .app + custom DMG
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          ARCH="${{ matrix.arch }}"
          MODE="${{ matrix.mode }}"
          OUT="./publish/\( {RID}- \){MODE}"
          EXE="${{ env.APP_EXE }}"
          BUNDLE="${{ env.APP_BUNDLE_NAME }}"

          echo "RID=$RID MODE=$MODE OUT=$OUT"
          if [ ! -d "$OUT" ]; then
            echo "Publish dir missing: $OUT"
            ls -la ./publish || true
            exit 1
          fi
          ls -la "$OUT" | head -20

          STAGE="dmg-stage"
          rm -rf "$STAGE"
          APP="$STAGE/$BUNDLE"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp -a "${OUT}/." "$APP/Contents/MacOS/"
          chmod +x "\( APP/Contents/MacOS/ \){EXE}" || true

          if [ -f installer/macos/AppIcon.icns ]; then
            cp installer/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
            ICON_KEY='    <key>CFBundleIconFile</key><string>AppIcon</string>'
          else
            ICON_KEY=''
          fi

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>${EXE}</string>
            <key>CFBundleIdentifier</key>
            <string>tech.rycb.pml2</string>
            <key>CFBundleName</key>
            <string>PML 2</string>
            <key>CFBundleDisplayName</key>
            <string>PML 2</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${V}</string>
            <key>CFBundleVersion</key>
            <string>${V}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          ${ICON_KEY}
          </dict>
          </plist>
          EOF

          echo -n 'APPL????' > "$APP/Contents/PkgInfo"
          xattr -cr "$APP" || true

          mkdir -p "$STAGE/.background"
          cp installer/macos/.DS_Store "$STAGE/.DS_Store"
          cp -a installer/macos/. "$STAGE/"
          ln -sf /Applications "$STAGE/Applications"

          mkdir -p dist
          RW_DMG="\( (pwd)/dist/pml2-rw- \){ARCH}-${MODE}.dmg"
          FINAL_DMG="\( (pwd)/dist/pml2- \){V}-macos-\( {ARCH}- \){MODE}.dmg"
          rm -f "$RW_DMG" "$FINAL_DMG"

          echo "Creating writable DMG (${MODE})..."
          hdiutil create \
            -volname "PML 2" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDRW \
            "$RW_DMG"

          echo "Compressing..."
          hdiutil convert \
            "$RW_DMG" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o "$FINAL_DMG"

          rm -f "$RW_DMG"
          ls -lh "$FINAL_DMG"
          hdiutil verify "$FINAL_DMG" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pml2-\( {{ steps.ver.outputs.version }}- \){{ matrix.rid }}-${{ matrix.mode }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten files
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -v {} upload/ \;
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: PML 2 ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: upload/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}