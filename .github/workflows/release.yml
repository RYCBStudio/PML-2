name: Release (Linux / macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 26.1.1'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: MEFrpLauncherX/MEFrpLauncherX.csproj
  APP_EXE: MEFrpLauncherX
  # macOS .app 显示名（与 create-dmg --icon 一致）
  APP_BUNDLE_NAME: 'PML 2.app'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            os_name: linux
            arch: x64
            pkg_arch: amd64
          - rid: linux-arm64
            os: ubuntu-latest
            os_name: linux
            arch: arm64
            pkg_arch: arm64
          - rid: osx-x64
            os: macos-latest
            os_name: macos
            arch: x64
            pkg_arch: x64
          - rid: osx-arm64
            os: macos-latest
            os_name: macos
            arch: arm64
            pkg_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Resolved version: $V"

      - name: Publish (ReadyToRun)
        shell: bash
        run: |
          set -euo pipefail
          OUT="./publish/${{ matrix.rid }}"
          mkdir -p "$OUT"
          dotnet publish "${{ env.PROJECT }}" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=true \
            -o "$OUT" \
            --nologo -v q
          if [ -f "$OUT/${{ env.APP_EXE }}" ]; then
            chmod +x "$OUT/${{ env.APP_EXE }}"
          fi
          echo "Publish OK, file count: $(find "$OUT" -type f | wc -l)"

      - name: Inject Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          OUT="./publish/${{ matrix.rid }}"
          if [ -n "$SENTRY_DSN" ]; then
            printf '%s\n' "{\"SentryDsn\":\"${SENTRY_DSN}\"}" > "$OUT/sentry.json"
            echo "sentry.json injected"
          else
            echo "No SENTRY_DSN secret, skip"
          fi

      - name: Install zstd (Ubuntu)
        if: matrix.os_name == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y zstd

      - name: Install zstd (macOS)
        if: matrix.os_name == 'macos'
        run: brew list zstd &>/dev/null || brew install zstd

      - name: Pack tar.gz + tar.zst
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH="${{ matrix.arch }}"
          OUT="./publish/${RID}"
          mkdir -p dist

          if [ ! -d "$OUT" ]; then
            echo "Publish dir missing: $OUT"
            exit 1
          fi

          TGZ="pml2-${V}-${OS_NAME}-${ARCH}-portable.tar.gz"
          TZST="pml2-${V}-${OS_NAME}-${ARCH}-portable.tar.zst"

          tar -C "$OUT" -cf - . | gzip -9 > "dist/${TGZ}"
          tar -C "$OUT" -cf - . | zstd -T0 -19 -o "dist/${TZST}"

          gzip -t "dist/${TGZ}"
          zstd -t "dist/${TZST}"

          ls -lh dist/ || true
          echo "tgz=${TGZ}" >> "$GITHUB_OUTPUT"
          echo "tzst=${TZST}" >> "$GITHUB_OUTPUT"

      # ---------- deb + rpm（仅 Linux）----------
      - name: Install nFPM
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Build deb + rpm
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          ARCH="${{ matrix.arch }}"
          PKG_ARCH="${{ matrix.pkg_arch }}"
          OUT="./publish/${RID}"
          ROOT="pkgroot"
          EXE="${{ env.APP_EXE }}"

          rm -rf "$ROOT"
          mkdir -p "$ROOT/opt/pml-2" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp -a "$OUT/." "$ROOT/opt/pml-2/"

          cat > "$ROOT/usr/bin/pml-2" << EOF
          #!/bin/sh
          exec /opt/pml-2/${EXE} "\$@"
          EOF
          chmod +x "$ROOT/usr/bin/pml-2"
          chmod +x "$ROOT/opt/pml-2/${EXE}" 2>/dev/null || true

          cat > "$ROOT/usr/share/applications/pml-2.desktop" << 'EOF'
          [Desktop Entry]
          Name=PML 2
          Comment=Cross-platform ME Frp graphical launcher
          Exec=pml-2
          Icon=pml-2
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          StartupNotify=true
          EOF

          cat > nfpm.yaml << EOF
          name: pml-2
          arch: ${PKG_ARCH}
          platform: linux
          version: ${V}
          section: utils
          priority: optional
          maintainer: RYCB Studio <im@rycb.tech>
          description: |
            PML 2 is a cross-platform graphical launcher for ME Frp.
          vendor: RYCB Studio
          homepage: https://www.rycb.tech/pml-2
          license: MIT
          contents:
            - src: ${ROOT}/opt/pml-2
              dst: /opt/pml-2
              type: tree
            - src: ${ROOT}/usr/bin/pml-2
              dst: /usr/bin/pml-2
              file_info:
                mode: 0755
            - src: ${ROOT}/usr/share/applications/pml-2.desktop
              dst: /usr/share/applications/pml-2.desktop
          EOF

          mkdir -p dist
          nfpm package -f nfpm.yaml -p deb -t "dist/pml2-${V}-linux-${ARCH}.deb"
          nfpm package -f nfpm.yaml -p rpm -t "dist/pml2-${V}-linux-${ARCH}.rpm"
          ls -lh dist/*.deb dist/*.rpm

      # ---------- 自定义 DMG（仅 macOS）----------
      - name: Install create-dmg
        if: matrix.os_name == 'macos'
        run: brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Build .app + custom DMG
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          ARCH="${{ matrix.arch }}"
          OUT="./publish/${RID}"
          EXE="${{ env.APP_EXE }}"
          BUNDLE="${{ env.APP_BUNDLE_NAME }}"
          # --- 组装 .app ---
          STAGE="dmg-stage"
          rm -rf "$STAGE"
          APP="$STAGE/$BUNDLE"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp -a "$OUT/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/${EXE}"

          # 可选 icns
          if [ -f installer/macos/AppIcon.icns ]; then
            cp installer/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
            ICON_KEY='    <key>CFBundleIconFile</key><string>AppIcon</string>'
          else
            ICON_KEY=''
          fi

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>${EXE}</string>
            <key>CFBundleIdentifier</key>
            <string>tech.rycb.pml2</string>
            <key>CFBundleName</key>
            <string>PML 2</string>
            <key>CFBundleDisplayName</key>
            <string>PML 2</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${V}</string>
            <key>CFBundleVersion</key>
            <string>${V}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          ${ICON_KEY}
          </dict>
          </plist>
          EOF

          echo -n 'APPL????' > "$APP/Contents/PkgInfo"

          # 清隔离属性，减少 CI/本机诡异问题
          xattr -cr "$APP" || true

          #
          # Finder 模板
          #
          mkdir -p "$STAGE/.background"

          cp installer/macos/.DS_Store \
            "$STAGE/.DS_Store"

          cp -a installer/macos/. "$STAGE/"

          ln -s /Applications "$STAGE/Applications"

          mkdir -p dist

          RW_DMG="$(pwd)/dist/pml2-rw.dmg"
          FINAL_DMG="$(pwd)/dist/pml2-${V}-macos-x64.dmg"

          rm -f "$RW_DMG" "$FINAL_DMG"

          echo "Creating writable DMG..."

          hdiutil create \
            -volname "PML 2" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDRW \
            "$RW_DMG"

          echo "Compressing..."

          hdiutil convert \
            "$RW_DMG" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o "$FINAL_DMG"

          rm "$RW_DMG"

          ls -lh "$FINAL_DMG"

          # 基本校验
          hdiutil verify "$DMG" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pml2-${{ steps.ver.outputs.version }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten files
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -v {} upload/ \;
          echo "======== Release files ========"
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: PML 2 ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: upload/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
