name: Release (Linux / macOS / Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 26.1.1'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: MEFrpLauncherX/MEFrpLauncherX.csproj
  APP_EXE: MEFrpLauncherX
  APP_BUNDLE_NAME: 'PML 2.app'
  CRASH_PROJECT: MEFrpLauncherX.CrashDisplayer/MEFrpLauncherX.CrashDisplayer.csproj
  SPLASH_PROJECT: RYCB.PML2.Splash/RYCB.PML2.Splash/RYCB.PML2.Splash.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux AOT ----------
          - rid: linux-x64
            os: ubuntu-latest
            os_name: linux
            arch: x64
            pkg_arch: amd64
            mode: aot
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            pkg_arch: arm64
            mode: aot
          # ---------- macOS AOT ----------
          - rid: osx-x64
            os: macos-latest
            os_name: macos
            arch: x64
            mode: aot
          - rid: osx-arm64
            os: macos-latest
            os_name: macos
            arch: arm64
            mode: aot
          # ---------- Windows AOT（离线安装包）----------
          # publish 输出路径必须与 installer/*.iss 中 Source 一致
          - rid: win-x64
            os: windows-latest
            os_name: windows
            arch: x64
            mode: aot
            publish_sub: win-x64-aot
            iss_script: winx64_aot_offline.iss
          - rid: win-arm64
            os: windows-latest
            os_name: windows
            arch: arm64
            mode: aot
            publish_sub: win-arm64
            iss_script: winarm64_offline.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install native AOT toolchain (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update -qq
          # zip 用于打「应用内更新包」（见下方 Pack update zip 步骤）
          sudo apt-get install -y clang zlib1g-dev zip

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      # ---------- CrashDisplayer & Splash：缓存 + AOT 构建（全平台统一）----------
      - name: Cache CrashDisplayer & Splash
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            tools-cache/${{ matrix.rid }}/CrashDisplayer
            tools-cache/${{ matrix.rid }}/Splash
          # key 必须覆盖所有会影响这两个工具二进制的输入：工具源码（含各自的
          # Directory.Build.props）+ 中央包版本清单（Avalonia / SkiaSharp 等版本都在
          # Directory.Packages.props）+ 本工作流。漏掉 Directory.Packages.props 时，
          # 升级依赖后仍会命中旧缓存，拿旧二进制去打包。
          key: tools-${{ matrix.rid }}-${{ hashFiles('MEFrpLauncherX.CrashDisplayer/**', 'RYCB.PML2.Splash/**', 'Directory.Packages.props', '.github/workflows/release.yml') }}
          restore-keys: |
            tools-${{ matrix.rid }}-

      # cache-hit 只代表「key 精确命中」，并不保证两个子目录真的在归档里。
      # 这里按目录实际内容再判定一次：目录缺失/为空就重建，从根上消除
      # 「缓存命中 → 少产物 → 下游 Place/Stage 报路径不存在」的连锁失败。
      - name: Detect cached tools
        id: tools-present
        shell: bash
        run: |
          set -euo pipefail
          for pair in "crash:CrashDisplayer" "splash:Splash"; do
            key="${pair%%:*}"
            name="${pair##*:}"
            dir="tools-cache/${{ matrix.rid }}/${name}"
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null || true)" ]; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
              echo "cached ${name}: yes"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
              echo "cached ${name}: no -> 将重新构建"
            fi
          done

      - name: Publish CrashDisplayer (AOT + SingleFile)
        if: steps.tools-present.outputs.crash != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="tools-cache/${{ matrix.rid }}/CrashDisplayer"
          mkdir -p "$OUT"

          dotnet publish "${{ env.CRASH_PROJECT }}" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "$OUT" \
            --nologo -v minimal

          find "$OUT" -type f \( \
            -name "*.pdb" -o -name "*.dbg" -o -name "*.mdb" -o \
            -name "*.dSYM" -o -name "*.ilk" -o -name "*.exp" -o \
            -name "*.lib" -o -name "*.map" \
          \) -delete 2>/dev/null || true

          if [[ "${{ matrix.rid }}" != win-* ]]; then
            find "$OUT" -type f ! -name "*.*" -exec chmod +x {} \; 2>/dev/null || true
            find "$OUT" -type f \( -name "*.so" -o -name "*.dylib" \) -exec chmod +x {} \; 2>/dev/null || true
          fi

          echo "===== CrashDisplayer (${{ matrix.rid }}) ====="
          ls -lh "$OUT" || true

      - name: Publish Splash (AOT + SingleFile)
        if: steps.tools-present.outputs.splash != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="tools-cache/${{ matrix.rid }}/Splash"
          mkdir -p "$OUT"

          dotnet publish "${{ env.SPLASH_PROJECT }}" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "$OUT" \
            --nologo -v minimal

          find "$OUT" -type f \( \
            -name "*.pdb" -o -name "*.dbg" -o -name "*.mdb" -o \
            -name "*.dSYM" -o -name "*.ilk" -o -name "*.exp" -o \
            -name "*.lib" -o -name "*.map" \
          \) -delete 2>/dev/null || true

          if [[ "${{ matrix.rid }}" != win-* ]]; then
            find "$OUT" -type f ! -name "*.*" -exec chmod +x {} \; 2>/dev/null || true
            find "$OUT" -type f \( -name "*.so" -o -name "*.dylib" \) -exec chmod +x {} \; 2>/dev/null || true
          fi

          echo "===== Splash (${{ matrix.rid }}) ====="
          ls -lh "$OUT" || true

      # ---------- 主程序发布 ----------
      # Linux/macOS: publish/<rid>-<mode>
      # Windows:    MEFrpLauncherX/bin/Release/net10.0/<publish_sub>/publish（与 ISS Source 对齐）
      - name: Publish main app
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            OUT="${{ github.workspace }}/MEFrpLauncherX/bin/Release/net10.0/${{ matrix.publish_sub }}/publish"
          else
            OUT="${{ github.workspace }}/publish/${{ matrix.rid }}-${{ matrix.mode }}"
          fi
          mkdir -p "$OUT"
          echo "Publishing -> $OUT (rid=${{ matrix.rid }} mode=${{ matrix.mode }})"

          if [ "${{ matrix.mode }}" = "aot" ]; then
            # DefineConstants: 定义 AOT 条件编译符号（与本地 pu.ps1 Set-ProjectMode 注入等价）
            # MSBuild 命令行 -p 值不支持 $(...) 引用，只能整体覆盖；
            # Core 项目 App.cs 的 #if AOT 决定 ReleaseFlag = "AOT"
            dotnet publish "${{ env.PROJECT }}" \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -p:PublishAot=true \
              -p:PublishTrimmed=true \
              -p:DefineConstants='AOT' \
              -o "$OUT" \
              --nologo -v q
          else
            dotnet publish "${{ env.PROJECT }}" \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -p:PublishReadyToRun=true \
              -p:PublishTrimmed=true \
              -o "$OUT" \
              --nologo -v q
          fi

          echo "Publish file count: $(find "$OUT" -type f | wc -l)"
          if [ "${{ matrix.os_name }}" != "windows" ]; then
            if [ -f "$OUT/${{ env.APP_EXE }}" ]; then
              chmod +x "$OUT/${{ env.APP_EXE }}"
            else
              echo "WARNING: ${{ env.APP_EXE }} not found in $OUT"
              find "$OUT" -maxdepth 1 -type f | head -20 || true
            fi
          fi

      # ---------- 放置 CrashDisplayer & Splash 到 Tools/（全平台统一）----------
      - name: Place CrashDisplayer & Splash into Tools/
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            OUT="${{ github.workspace }}/MEFrpLauncherX/bin/Release/net10.0/${{ matrix.publish_sub }}/publish"
          else
            OUT="${{ github.workspace }}/publish/${{ matrix.rid }}-${{ matrix.mode }}"
          fi
          TOOLS="$OUT/Tools"
          mkdir -p "$TOOLS"

          CRASH_SRC="tools-cache/${{ matrix.rid }}/CrashDisplayer"
          SPLASH_SRC="tools-cache/${{ matrix.rid }}/Splash"

          # CrashDisplayer：保持原名，整目录拷入 Tools
          if [ -d "$CRASH_SRC" ]; then
            cp -a "$CRASH_SRC"/. "$TOOLS/"
            echo "CrashDisplayer copied to $TOOLS"
          else
            echo "ERROR: CrashDisplayer cache/build missing: $CRASH_SRC"
            exit 1
          fi

          # Splash：Unix -> splash；Windows -> splash.exe
          if [ ! -d "$SPLASH_SRC" ]; then
            echo "ERROR: Splash cache/build missing: $SPLASH_SRC"
            exit 1
          fi

          if [ "${{ matrix.os_name }}" = "windows" ]; then
            SPLASH_EXE=$(find "$SPLASH_SRC" -maxdepth 1 -type f -name "*.exe" -print -quit)
            if [ -z "$SPLASH_EXE" ]; then
              SPLASH_EXE=$(find "$SPLASH_SRC" -maxdepth 1 -type f -print -quit)
            fi
            if [ -n "$SPLASH_EXE" ] && [ -f "$SPLASH_EXE" ]; then
              cp -a "$SPLASH_EXE" "$TOOLS/splash.exe"
              echo "Splash renamed to splash.exe at $TOOLS"
            else
              echo "ERROR: could not find Splash executable in $SPLASH_SRC"
              ls -la "$SPLASH_SRC" || true
              exit 1
            fi
          else
            MAIN_EXE=""
            for f in "$SPLASH_SRC"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                *.json|*.pdb|*.dbg|*.config|*.xml) continue ;;
              esac
              if [ -x "$f" ] || [[ "$base" != *.* ]]; then
                MAIN_EXE="$f"
                break
              fi
            done
            if [ -z "$MAIN_EXE" ]; then
              MAIN_EXE=$(find "$SPLASH_SRC" -type f -print -quit)
            fi
            if [ -n "$MAIN_EXE" ] && [ -f "$MAIN_EXE" ]; then
              cp -a "$MAIN_EXE" "$TOOLS/splash"
              chmod +x "$TOOLS/splash"
              echo "Splash renamed to splash at $TOOLS/splash"
            else
              echo "ERROR: could not find Splash executable in $SPLASH_SRC"
              ls -la "$SPLASH_SRC" || true
              exit 1
            fi
          fi

          echo "===== Tools/ final contents ====="
          ls -lh "$TOOLS" || true

      - name: Inject Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            OUT="${{ github.workspace }}/MEFrpLauncherX/bin/Release/net10.0/${{ matrix.publish_sub }}/publish"
          else
            OUT="${{ github.workspace }}/publish/${{ matrix.rid }}-${{ matrix.mode }}"
          fi
          if [ -n "${SENTRY_DSN:-}" ]; then
            printf '%s\n' "{\"SentryDsn\":\"${SENTRY_DSN}\"}" > "$OUT/sentry.json"
            echo "sentry.json injected"
          else
            echo "No SENTRY_DSN secret, skip"
          fi

      # ========== 26.5.0 布局暂存（必须在所有打包步骤之前）==========
      # 把扁平的 publish 产物重排为：PML 2 + launcher.json + vXXX/ + data/
      # Linux/macOS 的 tar.gz/tar.zst、deb/rpm、.app 均以该目录为内容，
      # Windows 的 ISCC 在后面消费同一个目录（StageDir 相对 installer/ 为 ..\dist\layout）。
      #
      # launcher.json 不再由这里生成：Windows 安装器在 ssPostInstall 自行写入，
      # 因为只有它知道「安装前的 current」并能把它保留为回滚点（previous）。
      # 暂存脚本仍会产出一份供非 Windows 分发包使用的 launcher.json。
      #
      # 注意：启动器不参与 tools-cache（该缓存只存 tools-cache/<rid>/CrashDisplayer|Splash），
      # 因此本步骤必须无条件执行。若加上 `if: cache-hit != 'true'`，缓存命中的矩阵项会
      # 直接跳过这里，launcher-publish/<rid>/ 从未生成，随后 Stage 步骤必然报
      # 「启动器目录不存在」—— 这正是 Linux/macOS 全部失败的根因。
      - name: Build launcher (PML 2)
        shell: bash
        run: |
          set -euo pipefail
          OUT="launcher-publish/${{ matrix.rid }}"
          # 先清空，避免上一次构建的残留文件伪装成本次产物
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # 启动器以「单文件 self-contained」发布：安装根只多出一个 PML 2.exe。
          # 若去掉 PublishSingleFile，数百个运行时 DLL 会堆进安装根，破坏布局整洁。
          dotnet publish PML2.Launcher/PML2.Launcher.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "$OUT" \
            --nologo -v minimal

          # 清掉残留的调试符号，避免被 stage-layout.sh 的污染检查误报
          find "$OUT" -type f \( -name "*.pdb" -o -name "*.dbg" -o -name "*.mdb" \) -delete 2>/dev/null || true

          echo "===== Launcher (${{ matrix.rid }}) ====="
          # `ls | head` 在 pipefail 下可能因 SIGPIPE 返回非零（产物异常多时），
          # 这里只用于展示，不能让展示命令影响步骤结果。
          ls -lh "$OUT" | head -20 || true

      - name: Stage versioned layout
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            PUB="${{ github.workspace }}/MEFrpLauncherX/bin/Release/net10.0/${{ matrix.publish_sub }}/publish"
          else
            PUB="${{ github.workspace }}/publish/${{ matrix.rid }}-${{ matrix.mode }}"
          fi

          LAUNCHER="${{ github.workspace }}/launcher-publish/${{ matrix.rid }}"
          STAGE="${{ github.workspace }}/dist/layout"

          # 前置校验：上游产物缺失时给出可读提示，而不是让暂存脚本抛路径错误。
          # 这里只做「报错更清楚」，不跳过任何构建步骤。
          if [ ! -d "$PUB" ]; then
            echo "ERROR: 主程序 publish 目录缺失: $PUB"
            ls -la "${{ github.workspace }}/publish" 2>/dev/null || true
            exit 1
          fi
          if [ ! -d "$LAUNCHER" ]; then
            echo "ERROR: 启动器产物目录缺失: $LAUNCHER"
            echo "       → 上游步骤 'Build launcher (PML 2)' 未执行或失败"
            ls -la "${{ github.workspace }}/launcher-publish" 2>/dev/null || true
            exit 1
          fi

          bash tools/stage-layout.sh "$PUB" "$LAUNCHER" "$STAGE" "$VERSION" "${{ matrix.mode }}"

          # 四个平台统一在此产出 dist/layout（PML 2(.exe) + vXXX/ + data/ + launcher.json）。
          # 后续 tar/deb/rpm/.app、Windows 的 ISCC 以及应用内更新 zip 都以它为唯一输入。
          ls -la "$STAGE" || true

      # ========== 应用内更新包（zip，26.5.1）==========
      # 与安装包的语义区分：
      #   安装包（exe / dmg / deb / rpm / tar.gz）→ 面向用户手动下载安装（含首次安装）；
      #   zip                                     → 仅供**应用内自动更新**下载后解压。
      #
      # zip 内容 = dist/layout/vXXX/ 的**内容本身**（不含 vXXX 这一层）：
      # 应用内更新只新增一个版本目录，启动器（PML 2）与 data/ 都是版本无关的，
      # 因此解压目标就是安装根下的新 vXXX，不需要重装，也不会多套一层父目录。
      #
      # 命名必须与 assets 挑选逻辑（GitHubReleaseService.ScoreAsset）严格对齐：
      #   pml2-{version}-{os}-{arch}-{mode}.zip
      #   os   ∈ windows | linux | macos
      #   arch ∈ x64 | arm64
      #   mode ∈ aot | r2r（ReadyToRun）
      - name: Pack update zip (Linux/macOS)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          LAYOUT="${{ github.workspace }}/dist/layout/v${V}"
          DIST="${{ github.workspace }}/dist"
          ZIP="pml2-${V}-${{ matrix.os_name }}-${{ matrix.arch }}-${{ matrix.mode }}.zip"

          if [ ! -d "$LAYOUT" ]; then
            echo "ERROR: 版本目录缺失: $LAYOUT（Stage versioned layout 未执行或失败）"
            ls -la "$DIST" || true
            exit 1
          fi

          mkdir -p "$DIST"
          rm -f "$DIST/$ZIP"

          # 在版本目录**内部**打包，条目因此是相对路径（解压即得到 vXXX/ 的内容）。
          # 刻意不加 -y：符号链接按实体文件存储 —— .NET 的 ZipFile 解压不会还原
          # 符号链接（会解成一个内容为链接目标的普通文件），存实体才是安全的。
          ( cd "$LAYOUT" && zip -qr -9 "$DIST/$ZIP" . )

          if [ ! -s "$DIST/$ZIP" ]; then
            echo "ERROR: zip 未生成或为空: $DIST/$ZIP"
            exit 1
          fi

          # 包内顶层必须是主程序本身，而不是 vXXX/ 或 dist/ 之类的父目录。
          # 部分 zip 实现会给条目加 "./" 前缀（解压结果等价），因此先归一化再判断；
          # 用 unzip -Z1 列清单（Linux/macOS 均自带 unzip，不必额外装 zipinfo）。
          LIST="${RUNNER_TEMP:-/tmp}/pml2-zip-list.txt"
          unzip -Z1 "$DIST/$ZIP" | sed 's|^\./||' > "$LIST"
          grep -qx "MEFrpLauncherX" "$LIST"
          echo "zip entries: $(wc -l < "$LIST")"
          rm -f "$LIST"
          ls -lh "$DIST/$ZIP"

      - name: Pack update zip (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $V = $env:VERSION
          $layout = Join-Path $env:GITHUB_WORKSPACE "dist/layout/v$V"
          if (-not (Test-Path $layout)) { throw "版本目录缺失: $layout" }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist "pml2-$V-${{ matrix.os_name }}-${{ matrix.arch }}-${{ matrix.mode }}.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }

          # 首选内置 Compress-Archive：无需外部工具，条目取通配符父目录的相对路径
          #（解压即得到 vXXX/ 的内容），行为已在本机验证。
          # 失败时用 windows runner 预装的 7-Zip 兜底。
          $packed = $false
          try {
            Compress-Archive -Path (Join-Path $layout '*') -DestinationPath $zip -CompressionLevel Optimal
            $packed = $true
          } catch {
            Write-Host "Compress-Archive 失败（$($_.Exception.Message)），改用 7-Zip"
          }

          if (-not $packed) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (-not (Test-Path $sevenZip)) { throw "打包失败：Compress-Archive 与 7-Zip 均不可用" }
            Push-Location $layout
            try {
              & $sevenZip a -tzip -mx=9 -y $zip '.\*' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7z 打包失败（exit $LASTEXITCODE）" }
            } finally {
              Pop-Location
            }
          }

          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -le 0) { throw "zip 未生成或为空: $zip" }

          # 包内顶层必须是主程序本身（用 .NET ZipFile 校验条目，避免依赖外部工具）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains 'MEFrpLauncherX.exe') {
              $preview = ($names | Select-Object -First 5) -join ', '
              throw "zip 顶层缺少 MEFrpLauncherX.exe（条目示例: $preview）"
            }
          } finally {
            $archive.Dispose()
          }

          Write-Host "update zip: $zip（$((Get-Item $zip).Length) 字节）"

      # ========== Linux 打包 ==========
      - name: Install zstd (Ubuntu)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd

      - name: Pack tar.gz + tar.zst (Linux only)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          # 26.5.0 起分发包内容 = 安装布局本身（PML 2 + launcher.json + vXXX/ + data/），
          # 解包即安装根，与 Windows 安装包、macOS .app 保持一致。
          LAYOUT="${{ github.workspace }}/dist/layout"
          DIST="${{ github.workspace }}/dist"
          OS_NAME="${{ matrix.os_name }}"
          ARCH="${{ matrix.arch }}"
          MODE="${{ matrix.mode }}"

          mkdir -p "$DIST"
          echo "Packing from: $LAYOUT"
          if [ ! -d "$LAYOUT" ]; then
            echo "ERROR: 布局目录缺失: $LAYOUT（Stage versioned layout 未执行或失败）"
            ls -la "${{ github.workspace }}/dist" || true
            exit 1
          fi

          TGZ="pml2-${V}-${OS_NAME}-${ARCH}-${MODE}-portable.tar.gz"
          TZST="pml2-${V}-${OS_NAME}-${ARCH}-${MODE}-portable.tar.zst"

          tar -C "$LAYOUT" -cf - . | gzip -9 > "$DIST/$TGZ"
          tar -C "$LAYOUT" -cf - . | zstd -T0 -19 -o "$DIST/$TZST"

          gzip -t "$DIST/$TGZ"
          zstd -t "$DIST/$TZST"

          # 包内必须是「安装根」布局，防止静默退回扁平 publish。
          #
          # 注意：这里刻意不用 `tar -tzf … | grep -qx …`。grep -q 命中即退出，
          # 而真实布局的清单有几百条（> 64KB 管道缓冲），tar 会继续往已关闭的
          # 管道写，报 "tar: stdout: write error"（exit 2）；在工作流的
          # `set -euo pipefail` 下会把整个步骤判成失败（Linux x64/arm64 已踩过）。
          # 因此先把清单落盘再校验，彻底避开 SIGPIPE。
          LIST="${RUNNER_TEMP:-/tmp}/pml2-layout-list.txt"
          tar -tzf "$DIST/$TGZ" > "$LIST"
          grep -qx "./launcher.json" "$LIST"
          grep -qx "./PML 2" "$LIST"
          echo "Layout entries: $(wc -l < "$LIST")"
          rm -f "$LIST"
          echo "Layout verified in $TGZ"

          ls -lh "$DIST" || true

      - name: Install nFPM
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Build deb + rpm
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          # 26.5.0 起包内容 = 安装布局，安装根即 /opt/pml-2：
          #   /opt/pml-2/PML 2        启动器（版本无关）
          #   /opt/pml-2/launcher.json
          #   /opt/pml-2/vXXX/         只读代码
          #   /opt/pml-2/data/         用户数据
          LAYOUT="${{ github.workspace }}/dist/layout"
          DIST="${{ github.workspace }}/dist"
          ARCH="${{ matrix.arch }}"
          PKG_ARCH="${{ matrix.pkg_arch }}"
          MODE="${{ matrix.mode }}"
          ROOT="${{ github.workspace }}/pkgroot"
          LAUNCHER="PML 2"

          if [ ! -d "$LAYOUT" ]; then
            echo "ERROR: 布局目录缺失: $LAYOUT（Stage versioned layout 未执行或失败）"
            ls -la "${{ github.workspace }}/dist" || true
            exit 1
          fi

          rm -rf "$ROOT"
          mkdir -p "$ROOT/opt/pml-2" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp -a "$LAYOUT/." "$ROOT/opt/pml-2/"

          # Settings.json 单独作为 conffile（deb）/ %config（rpm）打包。
          # 新布局下用户配置位于 data/Config/，安装包里默认不带该文件（首次运行由程序生成），
          # 因此这里通常走 WARNING 分支；若将来把默认配置放进 data/，此处自动生效。
          CONFFILE_ENTRY=""
          if [ -f "$ROOT/opt/pml-2/data/Config/Settings.json" ]; then
            mkdir -p "$ROOT/conffiles"
            mv "$ROOT/opt/pml-2/data/Config/Settings.json" "$ROOT/conffiles/Settings.json"
            CONFFILE_ENTRY="yes"
          else
            echo "WARNING: data/Config/Settings.json not found in layout, skip conffile packaging"
          fi

          # 入口指向安装根的启动器（版本无关）；文件名含空格，必须加引号。
          cat > "$ROOT/usr/bin/pml-2" << EOF
          #!/bin/sh
          exec "/opt/pml-2/${LAUNCHER}" "\$@"
          EOF
          chmod +x "$ROOT/usr/bin/pml-2"
          chmod +x "$ROOT/opt/pml-2/${LAUNCHER}" 2>/dev/null || true

          cat > "$ROOT/usr/share/applications/pml-2.desktop" << 'EOF'
          [Desktop Entry]
          Name=PML 2
          Comment=Cross-platform ME Frp graphical launcher
          Exec=pml-2
          Icon=pml-2
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          StartupNotify=true
          EOF

          cat > "${{ github.workspace }}/nfpm.yaml" << EOF
          name: pml-2
          arch: ${PKG_ARCH}
          platform: linux
          version: ${V}
          section: utils
          priority: optional
          maintainer: RYCB Studio <im@rycb.tech>
          description: |
            PML 2 is a cross-platform graphical launcher for ME Frp (${MODE}).
          vendor: RYCB Studio
          homepage: https://www.rycb.tech/pml-2
          license: MIT
          # 运行时依赖与 install.sh 中 install_system_deps 对齐
          # （apt/dnf 装包时自动拉取；极旧发行版上 libssl/libicu 版本由发行版提供）
          overrides:
            deb:
              depends:
                - libx11-6
                - libice6
                - libsm6
                - libfontconfig1
                - fontconfig
                - fonts-dejavu-core
                - ca-certificates
                - tzdata
                - libc6
                - libgcc-s1
                - libgssapi-krb5-2
                - libstdc++6
                - zlib1g
                - libnotify4
                - libssl3 | libssl1.1 | libssl1.0.2 | libssl1.0.0
                - libicu74 | libicu72 | libicu71 | libicu70 | libicu69 | libicu68 | libicu67 | libicu66 | libicu63 | libicu60
            rpm:
              depends:
                - libX11
                - libICE
                - libSM
                - fontconfig
                - dejavu-sans-fonts
                - ca-certificates
                - tzdata
                - glibc
                - libgcc
                - krb5-libs
                - libstdc++
                - zlib
                - libnotify
                - openssl
                - libicu
          contents:
            - src: ${ROOT}/opt/pml-2
              dst: /opt/pml-2
              type: tree
            - src: ${ROOT}/usr/bin/pml-2
              dst: /usr/bin/pml-2
              file_info:
                mode: 0755
            - src: ${ROOT}/usr/share/applications/pml-2.desktop
              dst: /usr/share/applications/pml-2.desktop
          EOF

          if [ "$CONFFILE_ENTRY" = "yes" ]; then
            cat >> "${{ github.workspace }}/nfpm.yaml" << EOF
            - src: ${ROOT}/conffiles/Settings.json
              dst: /opt/pml-2/data/Config/Settings.json
              type: config
          EOF
          fi

          mkdir -p "$DIST"
          nfpm package -f "${{ github.workspace }}/nfpm.yaml" -p deb -t "$DIST/pml2-${V}-linux-${ARCH}-${MODE}.deb"
          nfpm package -f "${{ github.workspace }}/nfpm.yaml" -p rpm -t "$DIST/pml2-${V}-linux-${ARCH}-${MODE}.rpm"
          ls -lh "$DIST"/*.deb "$DIST"/*.rpm || true

      # ========== macOS 打包 ==========
      - name: Build .app + custom DMG
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          # 26.5.0 起 .app 内容 = 安装布局：Contents/MacOS 就是「安装根」，
          # PML 2（启动器）+ launcher.json + vXXX/ + data/，与 Windows/Linux 一致。
          # 启动器用 Environment.ProcessPath 推导安装根，因此这里布局成立。
          LAYOUT="${{ github.workspace }}/dist/layout"
          DIST="${{ github.workspace }}/dist"
          ARCH="${{ matrix.arch }}"
          MODE="${{ matrix.mode }}"
          LAUNCHER="PML 2"
          BUNDLE="${{ env.APP_BUNDLE_NAME }}"
          STAGE="${{ github.workspace }}/dmg-stage"

          echo "DMG from: $LAYOUT (mode=$MODE arch=$ARCH)"
          if [ ! -d "$LAYOUT" ]; then
            echo "ERROR: 布局目录缺失: $LAYOUT（Stage versioned layout 未执行或失败）"
            ls -la "${{ github.workspace }}/dist" || true
            exit 1
          fi

          rm -rf "$STAGE"
          APP="$STAGE/$BUNDLE"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -a "$LAYOUT/." "$APP/Contents/MacOS/"
          # 可执行位：启动器在安装根，splash 在 vXXX/Tools/ 下
          chmod +x "$APP/Contents/MacOS/${LAUNCHER}" || true
          find "$APP/Contents/MacOS" -path "*/Tools/*" -type f -exec chmod +x {} \; 2>/dev/null || true

          if [ -f "${{ github.workspace }}/installer/macos/AppIcon.icns" ]; then
            cp "${{ github.workspace }}/installer/macos/AppIcon.icns" "$APP/Contents/Resources/AppIcon.icns"
            ICON_KEY='    <key>CFBundleIconFile</key><string>AppIcon</string>'
          else
            ICON_KEY=''
          fi

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleExecutable</key>
          <string>${LAUNCHER}</string>
          <key>CFBundleIdentifier</key>
          <string>tech.rycb.pml2</string>
          <key>CFBundleName</key>
          <string>PML2</string>
          <key>CFBundleDisplayName</key>
          <string>PML 2</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>${V}</string>
          <key>CFBundleVersion</key>
          <string>${V}</string>
          <key>LSMinimumSystemVersion</key>
          <string>12.0</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>CFBundleURLTypes</key>
          <array>
          <dict>
          <key>CFBundleURLName</key>
          <string>tech.rycb.pml2</string>
          <key>CFBundleTypeRole</key>
          <string>Viewer</string>
          <key>CFBundleURLSchemes</key>
          <array>
          <string>pml2</string>
          </array>
          </dict>
          </array>
          ${ICON_KEY}
          </dict>
          </plist>
          EOF

          echo -n 'APPL????' > "$APP/Contents/PkgInfo"
          xattr -crd "$APP" || true

          mkdir -p "$STAGE/.background"
          cp "${{ github.workspace }}/installer/macos/.DS_Store" "$STAGE/.DS_Store"
          cp -a "${{ github.workspace }}/installer/macos/." "$STAGE/"
          ln -sf /Applications "$STAGE/Applications"

          mkdir -p "$DIST"
          RW_DMG="$DIST/pml2-rw-${ARCH}-${MODE}.dmg"
          FINAL_DMG="$DIST/pml2-${V}-macos-${ARCH}-${MODE}.dmg"
          rm -f "$RW_DMG" "$FINAL_DMG"

          echo "Creating writable DMG (${MODE})..."
          hdiutil create \
            -volname "PML 2" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDRW \
            "$RW_DMG"

          echo "Compressing..."
          hdiutil convert \
            "$RW_DMG" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o "$FINAL_DMG"

          rm -f "$RW_DMG"
          ls -lh "$FINAL_DMG" || true
          hdiutil verify "$FINAL_DMG" || true

      # 布局暂存（Build launcher + Stage versioned layout）已上移到所有打包步骤之前：
      # Linux/macOS 的 tar.gz / deb / rpm / .app 内容直接取自 dist/layout，
      # Windows 的 ISCC 仍在下面消费同一个目录。

      # ========== Windows 打包（Inno Setup 离线安装包）==========
      - name: Install Inno Setup
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build offline installer (ISCC)
        if: matrix.os_name == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $V = $env:VERSION

          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "ISCC: $($iscc.FullName)"

          New-Item -ItemType Directory -Force -Path "$ws/dist" | Out-Null

          # ISS 使用相对路径（相对 installer/），无需替换硬编码盘符路径。
          # 通过 /D 注入版本、布局目录名、暂存目录与输出目录。
          $iss = Join-Path $ws "installer/${{ matrix.iss_script }}"
          if (-not (Test-Path $iss)) { throw "ISS not found: $iss" }

          $verDefine = if ("${{ matrix.rid }}" -eq "win-x64" -and "${{ matrix.mode }}" -eq "aot") {
            "$V AOT"
          } else {
            $V
          }
          $outDir = Join-Path $ws "dist"
          # 暂存布局中版本目录名带 v 前缀；ISS 需要与之一致。
          $layoutDir = "v$V"

          Write-Host "Compiling $iss"
          Write-Host "  MyAppVersion=$verDefine"
          Write-Host "  LayoutDir=$layoutDir"
          Write-Host "  StageDir=$outDir\layout"
          Write-Host "  OutDir=$outDir"
          Write-Host "  （launcher.json 由 ISS 在安装结束时写入，current=${layoutDir}）"

          & $iscc.FullName `
            "/DMyAppVersion=$verDefine" `
            "/DLayoutDir=$layoutDir" `
            "/DStageDir=$outDir\layout" `
            "/DOutDir=$outDir" `
            $iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for ${{ matrix.iss_script }}" }

          # 安装包生成后删除暂存布局：dist\ 里只应留下可分发的安装包，
          # 否则 upload-artifact 会把整个展开目录也传上去。
          Remove-Item -Recurse -Force (Join-Path $outDir "layout") -ErrorAction SilentlyContinue

          Write-Host "===== dist ====="
          Get-ChildItem "$ws/dist" | Select-Object Name, Length

      # ---------- 上传产物 ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pml2-${{ steps.ver.outputs.version }}-${{ matrix.rid }}-${{ matrix.mode }}${{ matrix.os_name == 'windows' && '-offline' || '' }}
          # dist/layout 是打包用中间产物：Windows 侧在 ISCC 之后已删除，非 Windows 侧会保留。
          # 必须在这里排除，否则 release 任务的 "Flatten files" 会把整棵布局树
          # （`find artifacts -type f`）展开成几百个零散的 release 附件。
          #
          # 注意：应用内更新 zip 落在 dist/ **根目录**（pml2-<ver>-<os>-<arch>-<mode>.zip），
          # 不在 dist/layout 之下，因此不会被上面的排除规则误伤。
          path: |
            ${{ github.workspace }}/dist/*
            !${{ github.workspace }}/dist/layout/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Resolve version & prerelease
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

          # 版本号含 preview（不区分大小写）时发布为 Pre-Release
          # 例: 26.3.0-preview1 / 26.3.0-Preview.2 / v26.3.0-PREVIEW
          if printf '%s' "$V" | grep -qi 'preview'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=PML 2 ${V} (Pre-release)" >> "$GITHUB_OUTPUT"
            echo "Resolved: version=$V  prerelease=yes"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=PML 2 ${V}" >> "$GITHUB_OUTPUT"
            echo "Resolved: version=$V  prerelease=no"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten files
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp -v {} upload/ \;
          echo "======== Release files ========"
          ls -lh upload/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: upload/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
